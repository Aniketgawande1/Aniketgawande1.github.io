<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aniket Gawande</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Cormorant+Infant:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* soft radial vignette — corners darker */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 75% 75% at 50% 50%,
        transparent 20%,
        rgba(0,0,0,.6) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* center stage */
    #center {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* NAME */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: clamp(3.8rem, 9.5vw, 9rem);
      color: #fff;
      letter-spacing: .01em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      animation: riseIn 1.6s .3s cubic-bezier(.16,1,.3,1) forwards;
      /* very faint luminance */
      text-shadow:
        0 0 120px rgba(255,255,255,.07),
        0 0  40px rgba(255,255,255,.04);
    }

    /* GLOW LINE — same as reference but richer */
    .line-wrap {
      position: relative;
      width: min(660px, 86vw);
      height: 1px;
      margin-top: 1.5rem;
      opacity: 0;
      animation: lineIn 1.2s 1.1s cubic-bezier(.16,1,.3,1) forwards;
    }

    /* main thin line */
    .line-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(100,180,255,.2) 15%,
        rgba(160,220,255,.95) 50%,
        rgba(100,180,255,.2) 85%,
        transparent 100%
      );
    }

    /* central lens bloom */
    .line-wrap::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 56px;
      background: radial-gradient(ellipse at center,
        rgba(100,185,255,.55) 0%,
        rgba(80,160,255,.15) 45%,
        transparent 70%
      );
      filter: blur(7px);
      animation: breathe 4s 1.3s ease-in-out infinite alternate;
    }

    /* inner core bright spot */
    .line-core {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 2px;
      background: rgba(200,235,255,.95);
      filter: blur(.5px);
      border-radius: 2px;
    }

    @keyframes breathe {
      from { opacity: .75; transform: translate(-50%,-50%) scaleX(.88); }
      to   { opacity: 1;   transform: translate(-50%,-50%) scaleX(1.1); }
    }

    /* SUBTITLE */
    .sub {
      margin-top: 1.4rem;
      font-family: 'Cormorant Infant', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(.85rem, 1.4vw, 1.05rem);
      letter-spacing: .06em;
      color: rgba(255,255,255,.42);
      opacity: 0;
      animation: fadeUp .9s 1.8s ease both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes lineIn {
      from { opacity: 0; transform: scaleX(.35); }
      to   { opacity: 1; transform: scaleX(1);   }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="center">
  <h1 class="name">Aniket Gawande</h1>
  <div class="line-wrap">
    <div class="line-core"></div>
  </div>
  <p class="sub">Something amazing is on the way</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, stars = [], meteors = [], t = 0;

/* ── resize ── */
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildStars();
}

/* ── stars ── */
function buildStars() {
  stars = [];
  const n = Math.floor(W * H / 780);   // dense — matches reference
  for (let i = 0; i < n; i++) {
    const big  = Math.random() < .022;
    const blue = Math.random() < .05;
    stars.push({
      x     : Math.random() * W,
      y     : Math.random() * H,
      r     : big ? Math.random()*1.5+.9 : Math.random()*.7+.1,
      base  : Math.random()*.8 + .15,
      phase : Math.random() * Math.PI * 2,
      freq  : Math.random()*.007 + .002,
      vx    : (Math.random()-.5) * .025,   // very slow drift
      vy    : (Math.random()-.5) * .025,
      big, blue,
      cross : big && Math.random() < .5,
    });
  }
}

/* ── 4-point cross ── */
function drawCross(x, y, r, a, blue) {
  const col = blue ? `rgba(160,215,255,${a})` : `rgba(255,255,255,${a})`;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur  = r * 16;
  ctx.lineWidth   = r * .55;
  ctx.lineCap     = 'round';
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(x - r*3.4, y); ctx.lineTo(x + r*3.4, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - r*3.4); ctx.lineTo(x, y + r*3.4); ctx.stroke();
  ctx.lineWidth   = r * .28; ctx.globalAlpha = .35;
  ctx.beginPath(); ctx.moveTo(x-r*1.6,y-r*1.6); ctx.lineTo(x+r*1.6,y+r*1.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+r*1.6,y-r*1.6); ctx.lineTo(x-r*1.6,y+r*1.6); ctx.stroke();
  ctx.restore();
}

/* ── meteor ── */
function spawnMeteor() {
  const angle = (25 + Math.random()*28) * Math.PI / 180;
  meteors.push({
    x : Math.random() * W * .8,
    y : Math.random() * H * .45,
    len   : 90 + Math.random()*130,
    speed : 10 + Math.random()*14,
    alpha : 0,
    life  : 0,
    phase : 'in',
    dx    : Math.cos(angle),
    dy    : Math.sin(angle),
    w     : .7 + Math.random()*.9,
    angle,
  });
}

function drawMeteor(m) {
  const tx = m.x - m.dx * m.len;
  const ty = m.y - m.dy * m.len;
  const g  = ctx.createLinearGradient(tx, ty, m.x, m.y);
  g.addColorStop(0,   'rgba(255,255,255,0)');
  g.addColorStop(.65, `rgba(200,230,255,${m.alpha * .55})`);
  g.addColorStop(1,   `rgba(255,255,255,${m.alpha})`);
  ctx.save();
  ctx.strokeStyle = g;
  ctx.lineWidth   = m.w;
  ctx.shadowColor = 'rgba(180,220,255,.7)';
  ctx.shadowBlur  = 5;
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(m.x, m.y);
  ctx.stroke();
  ctx.fillStyle  = `rgba(255,255,255,${m.alpha})`;
  ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(m.x, m.y, m.w, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ── frame ── */
function frame() {
  ctx.clearRect(0, 0, W, H);
  t += .01;

  stars.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
    if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;

    const fl = .48 + .52 * Math.sin(t / s.freq + s.phase);
    const a  = s.base * fl;

    if (s.cross) { drawCross(s.x, s.y, s.r, a, s.blue); return; }

    const col = s.blue ? `rgba(160,215,255,${a})` : `rgba(255,255,255,${a})`;
    ctx.save();
    ctx.fillStyle   = col;
    ctx.shadowColor = col;
    ctx.shadowBlur  = s.big ? s.r * 14 : s.r * 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  meteors = meteors.filter(m => {
    m.life++;
    if      (m.phase === 'in')   { m.alpha += .08; if (m.alpha >= 1) { m.alpha = 1; m.phase = 'move'; } }
    else if (m.phase === 'move') { m.x += m.dx*m.speed; m.y += m.dy*m.speed; if (m.life > 42) m.phase = 'out'; }
    else                         { m.alpha -= .055; m.x += m.dx*m.speed*.4; m.y += m.dy*m.speed*.4; if (m.alpha <= 0) return false; }
    drawMeteor(m);
    return true;
  });

  requestAnimationFrame(frame);
}

/* ── meteor scheduler ── */
function schedule() {
  spawnMeteor();
  if (Math.random() < .3)  setTimeout(spawnMeteor, 230);
  if (Math.random() < .15) setTimeout(spawnMeteor, 460);
  setTimeout(schedule, 2200 + Math.random() * 4800);
}

window.addEventListener('resize', resize);
resize();
frame();
setTimeout(schedule, 1000);
</script>
</body>
</html>
